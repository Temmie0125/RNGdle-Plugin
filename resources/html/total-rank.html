<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #0b0e17 0%, #10152a 55%, #0d1120 100%);
    color: #e5e7eb; width: 640px;
  }
  #container { padding: 28px 30px; }
  .title { font-size: 24px; font-weight: 800; margin-bottom: 16px;
    background: linear-gradient(90deg, #fbbf24, #f472b6, #818cf8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 14px 20px; margin-bottom: 14px; }
  .sec-title { display: flex; align-items: baseline; gap: 10px; padding: 6px 10px 10px; }
  .sec-title .name { font-size: 15px; font-weight: 800; color: #fbbf24; }
  .sec-title .name::before { content: ""; display: inline-block; width: 4px; height: 13px;
    border-radius: 2px; margin-right: 7px; background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,0.6); }
  .sec-title .sub { font-size: 11.5px; color: #6b7280; }
  .head { display: flex; font-size: 12px; color: #6b7280; padding: 6px 10px; }
  .r { display: flex; align-items: center; padding: 9px 10px; border-radius: 10px; }
  .r:nth-child(even) { background: rgba(255,255,255,0.025); }
  .rank-no { width: 44px; font-size: 15px; font-weight: 800; color: #6b7280; }
  .rank-no.top1 { color: #fbbf24; } .rank-no.top2 { color: #d1d5db; } .rank-no.top3 { color: #fdba74; }
  .rname { flex: 1; font-size: 14px; color: #e5e7eb; font-weight: 600;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .col-num { width: 120px; text-align: right; font-size: 13px; color: #93c5fd; font-family: Consolas, monospace; }
  .col-ep { width: 150px; text-align: right; font-size: 14px; font-weight: 800; color: #fbbf24; }
  .col-rolls { width: 80px; text-align: right; font-size: 12px; color: #9ca3af; }
  .footer { text-align: center; font-size: 12px; color: #6b7280; margin-top: 4px; }
  .empty { text-align: center; font-size: 13px; color: #6b7280; padding: 22px 0; }
</style>
</head>
<body>
<div id="container">
  <div class="title">💎 RNGdle · 累计总榜</div>

  <div class="card">
    <div class="sec-title">
      <span class="name">历史 EP 排行</span>
      <span class="sub">按累计 EP 排序 · 共 {{totalPlayers}} 名玩家 · 显示前 {{limit}} 名</span>
    </div>
    {{if users.length}}
    <div class="head">
      <span class="rank-no">#</span><span class="rname">玩家</span>
      <span class="col-num">最佳数字</span><span class="col-rolls">掷数</span><span class="col-ep">累计 EP</span>
    </div>
    {{each users u}}
    <div class="r">
      <span class="rank-no {{u.rank === 1 ? 'top1' : u.rank === 2 ? 'top2' : u.rank === 3 ? 'top3' : ''}}">{{u.rank}}</span>
      <span class="rname">{{u.name}}</span>
      <span class="col-num">{{u.bestNumber}}</span>
      <span class="col-rolls">{{u.rolls}}</span>
      <span class="col-ep">{{u.ep}}</span>
    </div>
    {{/each}}
    {{else}}
    <div class="empty">还没有玩家数据</div>
    {{/if}}
  </div>

  <div class="footer">🎲 累计 EP 为历史所有掷数之和 · 发送 #RNGdle日榜 查看今日战况</div>
</div>
</body>
</html>
